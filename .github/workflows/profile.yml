name: Render profile

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, assets/**]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s scripts -q
      - name: Render session.svg, pills and README
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/render.py
      - name: Commit
        run: |
          git config user.name tincke10
          git config user.email martinmoreiralmq@gmail.com
          git add -A session.svg pills README.md
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: render profile" && git push; fi
